# Base configuration for services.yaml

imports:
  - { resource: '../vendor/derafu/foundation/resources/config/foundation-services.yaml' }

parameters:
    # The language of the site: the one of the environment variable APP_LOCALE,
    # or English. The texts of the site are in English, and its translations are
    # in resources/translations. (This is the default of derafu/foundation, it is
    # here to show where to change it.)
    app.locale.default: 'en'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\Controller\:
        resource: '../src/Controller/'
        public: true

    # Feeds resources/translations of the site into the Translator, which is
    # defined in derafu/foundation.
    App\Translation\WebsiteTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
